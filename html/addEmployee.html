<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <link rel="stylesheet" href="../css/employees.css">
    <link rel="stylesheet" href="../css/addEmployee.css">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
   
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">
            <img src="../images/TezoLogo.png" class="logo">
            <p class="sidebar-title">ALL</p>
            <ul class="menu">
                <li>
                    <img src="../images/Vertical nav/Dashboard.svg">
                    <span>Dashboard</span>
                </li>
                <a href="../html/employees.html">
                <li>
                    <img src="../images/Vertical nav/Employees.svg">
                    <span>Employees</span>
                </li></a>
            </ul>

             <p class="sidebar-title">ROLE / USER MANAGEMENT</p>
            <ul class="menu">
                <a href="../html/roles.html">
                    <li>

                        <img src="../images/Vertical nav/Roles.svg" alt="vertical-nav-roles">
                        <span>Roles</span>
                        <i class="bi bi-chevron-right"></i>

                    </li>
                </a>
                <li>
                    <img src="../images/Vertical nav/assign user.svg" alt="vertical-nav-assignuser">
                    <span>Access rights</span>
                    <i class="bi bi-chevron-right"></i>
                </li>
            </ul>

            <div class="update-box">
                <p class="install-text">Install new update 2.3.1A</p>
                <p class="update-subtitle">Allow to launch the new update for the AD application</p>
                <div class="update-actions">
                    <button class="btn-light">Dismiss</button>
                    <button class="btn-primary">Accept</button>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <main class="main">

            <!-- Page Header -->
            <section class="page-header">
                <div>
                    <h2>Add Employee</h2>
                    <p>Create a new employee account.</p>
                </div>
            </section>

            <!-- Form Section -->
            <section class="form-wrapper">

                <form id="addEmployeeForm">

                    <div class="form-grid">

                        <div class="form-group">
                            <label>Employee ID<sup>*</sup></label>
                            <input type="text" id="empId" required>
                        </div>

                        <div class="form-group">
                            <label>First Name<sup>*</sup></label>
                            <input type="text" id="firstName" required>
                        </div>

                        <div class="form-group">
                            <label>Last Name<sup>*</sup></label>
                            <input type="text" id="lastName" required>
                        </div>

                        <div class="form-group">
                            <label>Email ID<sup>*</sup></label>
                            <input type="email" id="email" required>
                        </div>

                        <div class="form-group">
                            <label>Joining Date<sup>*</sup></label>
                            <input type="date" id="joiningDate" required>
                        </div>

                        <div class="form-group">
                            <label>Location</label>
                            <select name="location">
                                <option>Hyderabad</option>
                                <option>Bengaluru</option>
                                <option>Chennai</option>
                                <option>Pune</option>
                                <option>Mumbai</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Department</label>
                            <select name="department">
                                <option>IT</option>
                                <option>Product Engg</option>
                                <option>UIUX</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Role</label>
                            <input type="text" id="role">
                        </div>

                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn-light">Cancel</button>
                        <button type="submit" class="btn-primary">Save Employee</button>
                    </div>

                </form>

                <!-- Success Message -->
                <div id="successMessage" class="success-message">
                    <i class="bi bi-check-circle-fill"></i>
                    Employee added successfully!
                </div>

            </section>

        </main>

    </div>
 <script src="../js/addEmployee.js"></script>
</body>

</html>
